name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

# Per calling workflow too: the push to main runs this both on its own and
# within the release (auto-release.yml), and neither may cancel the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Unit- und Integrationstests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # Component tests run in a real browser (vitest-browser-svelte).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit -- --run
      # GreenMail, the test mail server, runs on Java (scripts/greenmail.mjs).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: .cache
          key: greenmail-${{ hashFiles('scripts/greenmail.mjs') }}
      - run: npm run test:integration

  e2e:
    name: E2E-Tests (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # GreenMail, the test mail server, runs on Java (scripts/greenmail.mjs).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: .cache
          key: greenmail-${{ hashFiles('scripts/greenmail.mjs') }}
      - run: npm run build
      # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron needs a display; xvfb-run provides a virtual one.
      - run: xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  package:
    name: Paketieren (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Unpacked only: proves the packaging config and native modules work.
      # The installers are built by release.yml.
      - run: npx electron-builder --linux dir --publish never
