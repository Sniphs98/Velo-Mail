name: Release

# Runs the full CI, builds the installers on Linux, Windows and macOS and
# publishes them as a GitHub release, together with the latest*.yml files the
# auto-updater reads. Started by auto-release.yml after every merge into main,
# or by pushing a version tag by hand (`git tag v1.2.0 && git push origin v1.2.0`).
on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: The version to release, e.g. v1.2.0
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Installer bauen (${{ matrix.name }})
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: --linux
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Unsigned until certificates exist; see PLAN.md, "Code-Signierung".
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Version aus dem Tag übernehmen
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub-Release erstellen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Release mit automatisch erzeugten Notizen anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          # --target: from auto-release.yml the tag doesn't exist yet and is
          # created on the released commit.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Velo Mail $TAG" \
            --generate-notes \
            $prerelease
