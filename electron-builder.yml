# Packaging, see https://www.electron.build/configuration
appId: io.github.sniphs98.velomail
productName: Velo Mail
artifactName: velo-mail-${version}-${os}-${arch}.${ext}

directories:
  output: release
  # Icons and installer assets; not "build", which holds the renderer.
  buildResources: resources

files:
  - out/**
  - build/**
  - drizzle/**
  # Window and tray icons, loaded at runtime (electron/main.ts, desktop.ts).
  - resources/icon.png
  - resources/tray/**
  - package.json

# Hardening of the Electron binary (https://www.electronjs.org/docs/latest/tutorial/fuses):
# the installed app cannot be run as plain Node or with a debugger attached,
# which would hand out its access (e.g. the passwords in the macOS keychain).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Unsigned macOS builds need a fresh ad-hoc signature after the change.
  resetAdHocDarwinSignature: true

linux:
  target: [AppImage, deb]
  category: Network;Email
  maintainer: Sniphs98 <sniphs98@users.noreply.github.com>

win:
  target: [nsis]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  # The zip is what the auto-updater downloads on macOS.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  category: public.app-category.productivity

publish:
  provider: github
  owner: Sniphs98
  repo: Velo-Mail
